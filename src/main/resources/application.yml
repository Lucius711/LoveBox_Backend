server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lovebox_db}
    username: ${DB_USERNAME:lovebox}
    password: ${DB_PASSWORD:lovebox}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100   # tránh N+1 khi load tags/ảnh/owner

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    secret: ${JWT_SECRET:lovebox-super-secret-key-change-in-production-must-be-at-least-256-bits}
    access-token-expiration-ms: 900000        # 15 minutes
    refresh-token-expiration-ms: 604800000    # 7 days

  google:
    client-id: ${GOOGLE_CLIENT_ID:}

  admin-emails: ${ADMIN_EMAILS:}
  r2:
    account-id: ${R2_ACCOUNT_ID}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    bucket: ${R2_BUCKET:lovebox}
    public-url: ${R2_PUBLIC_URL}   # vd https://pub-xxxx.r2.dev hoặc domain riêng gắn vào bucket

  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    chat-model: ${GEMINI_MODEL:gemini-2.5-flash}
    fallback-chat-model: gemini-2.0-flash

  payment:
    payos:
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
      return-url: ${PAYOS_RETURN_URL:http://localhost:5173/checkout/success}
      cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/checkout/success}

  notification:
    resend-api-key: ${RESEND_API_KEY:}
    from-email: ${FROM_EMAIL:noreply@lentique.vn}

  frontend-url: ${FRONTEND_URL:http://localhost:5173}

logging:
  level:
    com.lovebox: DEBUG
    org.springframework.security: INFO
